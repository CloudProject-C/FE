<!DOCTYPE html>
<html>
<head>
  <script
          type="text/javascript"
          src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=vxsqc58u7x">
  </script>
  <script>
    window.initNaverMap = function (elementId) {
      let retry = 0;

      function tryInit() {
        const el = document.getElementById(elementId);

        if (!window.naver || !el) {
          if (retry++ < 50) setTimeout(tryInit, 100);
          return;
        }

        const width = el.offsetWidth;
        const height = el.offsetHeight;

        if (width === 0 || height === 0) {
          if (retry++ < 50) setTimeout(tryInit, 100);
          return;
        }

        if (el.__naverMap) return;

        const map = new naver.maps.Map(el, {
          center: new naver.maps.LatLng(37.5665, 126.9780),
          zoom: 10
        });

        el.__naverMap = map;

        // 🔑 강제 리사이즈
        setTimeout(() => {
          map.refresh();
        }, 300);
      }

      tryInit();
    };
  </script>
